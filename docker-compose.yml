services:
  web:
    build: .
    image: choose-the-surprise:latest
    container_name: choose-the-surprise
    ports:
      - "8080:80"
    volumes:
      # Bind mount: perubahan file di project langsung terlihat tanpa rebuild
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
