server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bind mount di Docker Desktop kadang menyajikan file lama jika sendfile aktif
    sendfile off;

    # Supaya browser selalu ambil versi terbaru saat di-refresh
    add_header Cache-Control "no-store";

    # Jangan sajikan file internal project yang ikut ter-mount
    location ~ /\. { deny all; }
    location ~ ^/(Dockerfile|docker-compose\.yml|nginx\.conf|README\.md|package-lock\.json)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
}
